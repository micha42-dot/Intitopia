<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intitopia - Human Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body, html { 
        margin: 0; 
        padding: 0; 
        height: 100%; 
        overflow: hidden; 
        background-color: #008080; /* Classic Win3.1 Desktop Teal */
        font-family: 'Pixelify Sans', sans-serif;
        font-smooth: never;
        -webkit-font-smoothing: none;
      }
      
      /* FIX: Ensure the React root container fills the screen so h-full works in child components */
      #root {
        height: 100%;
        width: 100%;
      }
      
      /* Win 3.1 UI Utilities */
      .win31-bg { background-color: #c0c0c0; }
      .win31-text { color: #000000; }
      
      .win31-border-outset {
        box-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #000000;
        border: 1px solid #c0c0c0; /* Fallback/Spacer */
      }
      
      .win31-border-inset {
        box-shadow: inset 1px 1px 0px #000000, inset -1px -1px 0px #ffffff;
      }

      .win31-btn {
        background-color: #c0c0c0;
        box-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .win31-btn:active {
        box-shadow: inset 1px 1px 0px #000000, inset -1px -1px 0px #ffffff;
        padding-top: 2px; /* Visual press */
      }
      
      .pixelated {
        image-rendering: pixelated;
      }
      
      /* Scrollbar to match gray theme */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: #c0c0c0; }
      ::-webkit-scrollbar-thumb { 
        background: #c0c0c0; 
        box-shadow: inset 1px 1px 0px #ffffff, inset -1px -1px 0px #000000;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
